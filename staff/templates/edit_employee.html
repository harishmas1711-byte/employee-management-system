{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Edit Employee</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

    <nav>

        <h2>Employee Management System</h2>

        <div>

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'employee_list' %}">
                Employees
            </a>

            <a href="{% url 'logout' %}"
               class="logout">
                Logout
            </a>

        </div>

    </nav>


    <div class="form-box">

        <h1>Edit Employee</h1>


        <form method="POST">

            {% csrf_token %}


            <label>Name</label>

            <input
                type="text"
                name="name"
                value="{{ employee.name }}"
                required
            >


            <label>Department</label>

            <input
                type="text"
                name="department"
                value="{{ employee.department }}"
                required
            >


            <label>Salary</label>

            <input
                type="number"
                name="salary"
                value="{{ employee.salary }}"
                required
            >


            <button type="submit">
                Update Employee
            </button>

        </form>

    </div>

</body>

</html>
