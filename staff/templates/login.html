{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Employee Management System - Login</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body class="login-page">

    <div class="login-box">

        <h1>Employee Management System</h1>

        <h2>Login</h2>

        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
